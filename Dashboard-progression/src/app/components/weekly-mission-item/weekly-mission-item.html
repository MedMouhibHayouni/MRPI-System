<li
  class="animate-float-in rounded-xl border bg-card p-3 transition-smooth hover:shadow-elegant"
  [class.opacity-70]="isDone()"
>
  <div class="grid grid-cols-[auto_minmax(0,1fr)] gap-3">
    <div class="grid h-9 w-9 shrink-0 place-items-center rounded-lg" [ngClass]="statusMeta().iconCls">
      @switch (mission().status) {
        @case ('completed') {
          <lucide-icon name="check" class="h-4 w-4" aria-hidden="true"></lucide-icon>
        }
        @case ('in_progress') {
          <lucide-icon name="loader-2" class="h-4 w-4 animate-spin" aria-hidden="true"></lucide-icon>
        }
        @default {
          <lucide-icon name="circle-dashed" class="h-4 w-4" aria-hidden="true"></lucide-icon>
        }
      }
    </div>
    <div class="min-w-0">
      <p
        class="text-sm font-medium"
        [class.line-through]="isDone()"
        [class.text-muted-foreground]="isDone()"
        [class.text-foreground]="!isDone()"
      >
        {{ mission().title }}
      </p>
      <div class="mt-1.5 flex flex-wrap items-center gap-2 text-xs text-muted-foreground">
        <span class="inline-flex h-5 items-center rounded-md border-0 px-1.5" [ngClass]="statusMeta().badgeCls">
          {{ statusMeta().label }}
        </span>
        <span class="inline-flex items-center gap-1">
          <lucide-icon name="calendar-clock" class="h-3 w-3" aria-hidden="true"></lucide-icon>
          {{ formattedDeadline() }}
        </span>
      </div>
    </div>
  </div>
  @if (!isDone()) {
    <button
      type="button"
      class="mt-3 h-8 w-full rounded-md border border-input bg-background text-sm font-medium transition-colors hover:bg-accent"
    >
      {{ isInProgress() ? 'Reprendre' : 'Démarrer' }}
    </button>
  }
</li>
