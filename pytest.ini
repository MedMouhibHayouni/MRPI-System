[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70

[coverage:run]
branch = True
omit =
    */schemas/__init__.py
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
